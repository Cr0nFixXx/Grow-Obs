# Local development defaults. Bind a TLS reverse proxy before internet exposure.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: growobserver
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grow -d growobserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://grow:${POSTGRES_PASSWORD}@db:5432/growobserver
      S3_ENDPOINT: http://minio:9000
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  storage-init:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://grow:${POSTGRES_PASSWORD}@db:5432/growobserver
      S3_ENDPOINT: http://minio:9000
    command: ["node", "dist/db/storage-init.js"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgres://grow:${POSTGRES_PASSWORD}@db:5432/growobserver
      S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  seed:
    profiles: ["demo"]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://grow:${POSTGRES_PASSWORD}@db:5432/growobserver
      S3_ENDPOINT: http://minio:9000
      ALLOW_DEMO_SEED: "true"
    command: ["npm", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
