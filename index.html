<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="Grow|Observer — Community-getriebenes Cannabis-Grow-Dashboard mit persönlichem Tagebuch, Kostenoptimierung und KI-Assistenz." />

    <!-- PWA -->
    <meta name="theme-color" content="#0a0d0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grow Observer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Social / OG -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grow|Observer — Community Grow Dashboard" />
    <meta property="og:description" content="Community-getriebenes Cannabis-Grow-Dashboard mit persönlichem Tagebuch, Kostenoptimierung und KI-Assistenz." />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grow|Observer" />
    <meta name="twitter:image" content="/images/og.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Grow|Observer — Community Grow Dashboard</title>

    <!-- No-FOUC theme bootstrap -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("go-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #0a0d0a; }
      html[data-theme="light"] body { background: #f5f6f1; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0a0d0a; z-index: 9999; transition: opacity .4s ease;
      }
      html[data-theme="light"] #boot { background: #f5f6f1; }
      #boot .leaf { width: 46px; height: 46px; border-radius: 14px;
        background: linear-gradient(135deg, #45bd5c, #1f8438);
        box-shadow: 0 0 40px -4px rgba(69,189,92,.7); animation: bp 1.1s ease-in-out infinite; }
      @keyframes bp { 0%,100% { transform: scale(.86); opacity:.7 } 50% { transform: scale(1); opacity:1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div class="leaf"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
